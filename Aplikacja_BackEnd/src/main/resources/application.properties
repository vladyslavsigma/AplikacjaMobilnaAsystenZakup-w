# Application Name
spring.application.name=Shop

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/shoppingdb
spring.data.mongodb.database=shoppingdb

# Static Resources for React SPA
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/
spring.web.resources.add-mappings=true

# Server Configuration
server.port=8080
server.error.whitelabel.enabled=false

# For SPA routing - this is now handled differently in newer Spring Boot
# Remove or comment out the problematic line
# spring.mvc.throw-exception-if-no-handler-found=true

# Alternative approach for SPA routing
spring.web.resources.chain.strategy.content.enabled=false

logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.example.shop=DEBUG


## Google Maps API Configuration
#google.api.key=TWÓJ_KLUCZ_API_TUTAJ
#google.api.cache.duration=3600 # 1 godzina w sekundach
#google.api.requests-per-second=10
#google.api.daily-limit=1000

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=storeLocations,googleMapsResults

